services:
  svd-connect-server:
    build: .
    image: svd-connect-server:latest
    container_name: svd-connect-server
    restart: unless-stopped
    # Copy .env.example to .env before running.
    env_file:
      - .env
    environment:
      # Behind the reverse proxy below, TLS is terminated upstream.
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      TRUST_PROXY: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
